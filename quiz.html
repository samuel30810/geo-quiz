<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>練習 — 地圖練習工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <button id="back-btn" class="back-btn">← 返回</button>
    <div id="score-display" class="score-display">答對 <strong>0</strong> / 0</div>
  </header>

  <main class="quiz-main">
    <div class="question-area">
      <div id="question-label" class="question-label">QUESTION 1</div>
      <h1 id="question-text" class="question-text">這是哪個縣市？</h1>
    </div>

    <div id="map-container" class="map-container">
      <div id="map-loading" class="map-loading">載入地圖中…</div>
      <div id="map-error" class="map-error" style="display:none"></div>
      <svg id="map-svg"></svg>
      <div class="scale-indicator">1.0×</div>
    </div>

    <div id="choices" class="choices-grid"></div>

    <div id="feedback" class="feedback-area"></div>

    <button id="next-btn" class="next-btn" style="display:none">下一題 →</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script src="js/data-taiwan.js"></script>
  <script src="js/data-world.js"></script>
  <script src="js/map.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
